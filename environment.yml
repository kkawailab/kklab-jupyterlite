# jupyterlite-xeus がビルド時に読み込むカーネル環境定義
# （jupyterlite/jupyterlite_xeus_r_stats_practice.ipynb 用の R カーネル）
name: xeus-kernels
channels:
  - https://repo.prefix.dev/emscripten-forge-dev
  - https://repo.prefix.dev/conda-forge
dependencies:
  - xeus-r
  # R チュートリアル用の追加パッケージ（emscripten-forge の wasm ビルド）
  - r-mass      # 回帰分析入門（ロバスト回帰・負の二項回帰など）
  - r-dplyr     # データ前処理入門
  - r-tidyr     # データ前処理入門（pivot_longer / pivot_wider）
  - r-tibble    # データ前処理入門
